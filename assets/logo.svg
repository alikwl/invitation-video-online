<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0a5"/>
      <stop offset="45%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9a7b1c"/>
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2438"/>
      <stop offset="100%" stop-color="#0e111a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Crest Icon -->
  <g transform="translate(10, 8)">
    <!-- Octagon / Diamond Luxury Frame -->
    <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#darkBg)" stroke="url(#goldGrad)" stroke-width="2" />
    <rect x="8" y="8" width="48" height="48" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
    
    <!-- Royal Envelope Fold -->
    <path d="M16 24 L32 36 L48 24" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Video Play Symbol Triangle Inside Crest -->
    <polygon points="28,26 40,33 28,40" fill="url(#goldGrad)" filter="url(#glow)"/>
    
    <!-- Sparkle Stars -->
    <circle cx="50" cy="14" r="2" fill="#fff" />
    <polygon points="16,48 18,52 16,56 14,52" fill="url(#goldGrad)" />
  </g>

  <!-- Typography: VideoInvitation.online -->
  <g transform="translate(82, 48)">
    <!-- Video Text -->
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Video<tspan fill="url(#goldGrad)">Invitation</tspan>
    </text>
    
    <!-- .online Badge -->
    <rect x="238" y="-22" width="78" height="24" rx="6" fill="url(#goldGrad)"/>
    <text x="277" y="-6" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#0b0c10" text-anchor="middle" letter-spacing="0.5">
      .ONLINE
    </text>

    <!-- Subtitle: By Malik Waseem -->
    <text x="2" y="16" font-family="'Playfair Display', Georgia, serif" font-size="12" font-style="italic" fill="#a0a6b5" letter-spacing="0.5">
      By Malik Waseem Studio • Premium Animated Cards
    </text>
  </g>
</svg>
