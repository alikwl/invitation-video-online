<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0a5"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9a7b1c"/>
    </linearGradient>
    <linearGradient id="darkFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191c28"/>
      <stop offset="100%" stop-color="#0b0c10"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#darkFav)" stroke="url(#goldFav)" stroke-width="2.5"/>
  <rect x="6" y="6" width="52" height="52" rx="12" fill="none" stroke="url(#goldFav)" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>

  <!-- Envelope flap -->
